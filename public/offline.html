<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1c232e" />
    <title>JD Times — 오프라인</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #eceeea;
        color: #1c232e;
        font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
        text-align: center;
        padding: 0 16px;
      }
      h1 {
        font-family: Georgia, serif;
        font-size: 28px;
        margin: 0 0 8px;
        border-bottom: 3px double #a63d33;
        display: inline-block;
        padding-bottom: 4px;
      }
      p { margin: 12px 0 20px; font-size: 14px; color: #4a5361; }
      button {
        border: 0;
        border-radius: 4px;
        background: #1c232e;
        color: #eceeea;
        padding: 10px 20px;
        font-size: 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>JD Times</h1>
      <p>인터넷에 연결되어 있지 않습니다.<br />연결을 확인한 뒤 다시 시도해주세요.</p>
      <button onclick="location.reload()">다시 시도</button>
    </main>
  </body>
</html>
